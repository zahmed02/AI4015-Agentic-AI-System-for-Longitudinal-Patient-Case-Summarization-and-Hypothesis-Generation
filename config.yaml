llm:
  primary_provider: gemini
  primary_model: gemini-flash-latest     # self-updating alias — avoids the next deprecation cliff
  fallback_provider: groq
  fallback_model: openai/gpt-oss-120b

embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2

chunking:
  chunk_size: 1000
  chunk_overlap: 150

vector_store:
  provider: chroma
  persist_dir: ./data/knowledge_base/chroma
  collection_name: patient_records

knowledge_graph:
  provider: neo4j
  enabled: true

guardrails:
  require_disclaimer: true
  max_objective_length: 500

paths:
  raw_data: ./data/raw
  processed_data: ./data/processed