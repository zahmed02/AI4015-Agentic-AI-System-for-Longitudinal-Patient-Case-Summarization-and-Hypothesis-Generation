services:
  neo4j:
    image: neo4j:5.24
    container_name: medchain-neo4j
    ports:
      - '7474:7474'  # Neo4j Browser UI
      - '7687:7687'  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/change_this_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs